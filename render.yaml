# Render Blueprint — https://render.com
# New → Blueprint → 이 저장소 선택 시 자동 인식. 키는 대시보드에서 입력(sync:false).
services:
  - type: web
    name: ai-compete
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    # start 스크립트가 `next start -H 0.0.0.0` → Render의 HOSTNAME(컨테이너명) 무시하고
    # 0.0.0.0 바인딩. (이게 502의 원인이었음)
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      # --- LLM 분석 (4개 모두 필요) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      # --- 국내 재무(DART) ---
      - key: DART_API_KEY
        sync: false
      # --- 13F (선택) ---
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENFIGI_API_KEY
        sync: false
