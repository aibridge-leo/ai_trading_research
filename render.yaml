# Render Blueprint — https://render.com
# New → Blueprint → 이 저장소 선택 시 자동 인식. 키는 대시보드에서 입력(sync:false).
services:
  - type: web
    name: ai-compete
    runtime: node
    plan: free
    autoDeploy: true
    # standalone 서버로 실행(메모리↓). 빌드 후 public·정적파일을 standalone에 복사.
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render가 HOSTNAME을 컨테이너명으로 설정 → standalone 서버가 0.0.0.0이 아닌
      # 엉뚱한 인터페이스에 바인딩되어 502 발생. 0.0.0.0으로 강제.
      - key: HOSTNAME
        value: 0.0.0.0
      # --- LLM 분석 (4개 모두 필요) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      # --- 국내 재무(DART) ---
      - key: DART_API_KEY
        sync: false
      # --- 13F (선택) ---
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENFIGI_API_KEY
        sync: false
